name: be_present
description: "Be Present - School Attendance Management Application"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Database
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # UI
  google_fonts: ^6.2.1
  flutter_slidable: ^4.0.0
  intl: ^0.20.2
  fl_chart: ^0.70.2

  # Utils
  uuid: ^4.5.1
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  share_plus: ^13.3.0
  permission_handler: ^11.4.0
  http: ^1.6.0
  file_picker: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.23.1
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  source_gen: ^2.0.0

flutter:
  uses-material-design: true
